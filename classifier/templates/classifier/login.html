{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toxic Comment Classifier</title>
    <link rel="stylesheet" href="{% static 'classifier/css/style.css' %}?v=2">
</head>
<body>
    <!-- Animated Background -->
    <div class="auth-bg-animation"></div>

    <div class="auth-page-container">
        <div class="auth-card">
            <!-- Demo Credentials Banner -->
            <div class="demo-banner">
                <div class="demo-banner-header">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    <span>Quick Access - Demo Accounts</span>
                </div>
                <div class="demo-accounts">
                    <button type="button" class="demo-account-btn" data-email="admin@toxic.com" data-password="admin123">
                        <div class="demo-account-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div class="demo-account-role">account-1</div>
                    </button>
                    <button type="button" class="demo-account-btn" data-email="user1@toxic.com" data-password="user123">
                        <div class="demo-account-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div class="demo-account-role">account-2</div>
                    </button>
                    <button type="button" class="demo-account-btn" data-email="user2@toxic.com" data-password="user123">
                        <div class="demo-account-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div class="demo-account-role">account-3</div>
                    </button>
                </div>
                <p class="demo-hint">Click any account to auto-fill credentials</p>
            </div>

            <!-- Divider -->
            <div class="auth-divider">
                <span>or sign in manually</span>
            </div>

            <!-- Login Form -->
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to classify comments</p>
            </div>

            <form id="form-login" class="login-form">
                <div class="form-group">
                    <label for="txt-email">Email Address</label>
                    <input
                        type="email"
                        id="txt-email"
                        class="input-control"
                        placeholder="name@domain.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="txt-password">Password</label>
                    <input
                        type="password"
                        id="txt-password"
                        class="input-control"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary">
                    Sign In
                </button>
            </form>

            <p class="helper-link-text">
                Don't have an account?
                <a href="{% url 'register' %}">Register here</a>
            </p>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('form-login');
            const btnSubmit = document.getElementById('btn-submit');
            const container = document.getElementById('toast-container');
            const emailInput = document.getElementById('txt-email');
            const passwordInput = document.getElementById('txt-password');

            // Demo account auto-fill
            document.querySelectorAll('.demo-account-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    emailInput.value = btn.dataset.email;
                    passwordInput.value = btn.dataset.password;
                    emailInput.focus();
                    document.querySelectorAll('.demo-account-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `<span>${type === 'success' ? '\u{1F389}' : '⚠️'}</span><span>${message}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<span class="spinner"></span> Signing in...';

                try {
                    const response = await fetch('{% url "login_api" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showToast('Login successful! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.href = '{% url "dashboard" %}';
                        }, 800);
                    } else {
                        showToast(data.message || 'Login failed', 'error');
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = 'Sign In';
                    }
                } catch (error) {
                    console.error('Error during login:', error);
                    showToast('An error occurred. Please try again later.', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Sign In';
                }
            });
        });
    </script>
</body>
</html>
