{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Toxic Comment Classifier</title>
    <link rel="stylesheet" href="{% static 'classifier/css/style.css' %}?v=2">
</head>
<body>
    <!-- Animated Background -->
    <div class="auth-bg-animation"></div>

    <div class="auth-page-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Register to start classifying comments</p>
            </div>
            
            <form id="form-register">
                <div class="form-group">
                    <label for="txt-email">Email Address</label>
                    <input 
                        type="email" 
                        id="txt-email" 
                        class="input-control" 
                        placeholder="name@domain.com" 
                        required 
                        autocomplete="email"
                    >
                </div>
                
                <div class="form-group">
                    <label for="txt-password">Password</label>
                    <input 
                        type="password" 
                        id="txt-password" 
                        class="input-control" 
                        placeholder="Create a password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>
                
                <button type="submit" id="btn-submit" class="btn btn-primary">
                    Register
                </button>
            </form>
            
            <p class="helper-link-text">
                Already have an account? 
                <a href="{% url 'login' %}">Login here</a>
            </p>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('form-register');
            const btnSubmit = document.getElementById('btn-submit');
            const container = document.getElementById('toast-container');

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `<span>${type === 'success' ? '🎉' : '⚠️'}</span><span>${message}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('txt-email').value.trim();
                const password = document.getElementById('txt-password').value;

                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<span class="spinner"></span> Registering...';

                try {
                    const response = await fetch('{% url "register_api" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showToast('Registration successful! Redirecting to login...', 'success');
                        setTimeout(() => {
                            window.location.href = '{% url "login" %}';
                        }, 1200);
                    } else {
                        showToast(data.message || 'Registration failed', 'error');
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = 'Register';
                    }
                } catch (error) {
                    console.error('Error during registration:', error);
                    showToast('An error occurred. Please try again later.', 'error');
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Register';
                }
            });
        });
    </script>
</body>
</html>
